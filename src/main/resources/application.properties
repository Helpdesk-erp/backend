spring.application.name=helpdesk

# Las variables (MONGODB_URI, JWT_SECRET...) se leen del sistema o del archivo Backend/.env,
# que no se sube al repositorio. En .env los valores van sin comillas.
spring.config.import=optional:file:.env[.properties]

# MongoDB. Tiene que ser Atlas o un replica set: las transacciones no funcionan en un mongod standalone.
spring.mongodb.uri=${MONGODB_URI}
spring.mongodb.database=${MONGODB_DATABASE:helpdesk_erp}
# clienteId en Java se guarda como cliente_id en MongoDB
spring.data.mongodb.field-naming-strategy=org.springframework.data.mapping.model.SnakeCaseFieldNamingStrategy
# Los índices los crea base_datos/01_esquema.js, no Spring
spring.data.mongodb.auto-index-creation=false

# El JSON de la API usa los mismos nombres de la base (fecha_creacion, cliente_id...)
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null

app.jwt.secreto=${JWT_SECRET:}
app.jwt.duracion-horas=8
app.cors.origenes=${CORS_ORIGENES:http://localhost:5173}
